name: Build DJ IMAN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: dj-iman-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable native APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install pinned Android SDK, NDK and CMake
        run: |
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Print build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build DJ IMAN debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p dist
          cp "$APK" 'dist/DJ-IMAN-3.4-Native-debug.apk'
          sha256sum 'dist/DJ-IMAN-3.4-Native-debug.apk' | tee 'dist/DJ-IMAN-3.4-Native-debug.apk.sha256'
          ls -lh dist/

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: DJ-IMAN-3.4-Native-APK
          path: |
            dist/DJ-IMAN-3.4-Native-debug.apk
            dist/DJ-IMAN-3.4-Native-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
