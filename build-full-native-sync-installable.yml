name: Build DJ IMAN Full Native Sync Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DJ_IMAN_3_4_NATIVE_FULL_SYNC_PORT_BUILD_READY.zip'
      - '.github/workflows/build-full-native-sync-installable.yml'

permissions:
  contents: read

concurrency:
  group: dj-iman-full-native-sync-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build separately installable full-native test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract full-native source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted
          unzip -q DJ_IMAN_3_4_NATIVE_FULL_SYNC_PORT_BUILD_READY.zip -d extracted
          test -f extracted/DJ_IMAN_3_4_NATIVE_ANDROID/app/build.gradle
          test -f extracted/DJ_IMAN_3_4_NATIVE_ANDROID/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      # Public TEST signing key only. Never use this key for Play Store release signing.
      - name: Install stable DJ IMAN test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          echo '' | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass 'djiman-test-2026' -alias djiman_native_test >/dev/null

      - name: Configure separate test package and stable debug signing
        shell: bash
        working-directory: extracted/DJ_IMAN_3_4_NATIVE_ANDROID
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          needle = "    defaultConfig {\n"
          if needle not in s:
              raise SystemExit('defaultConfig block not found')
          signing = """    signingConfigs {
              nativeTest {
                  storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                  storePassword 'djiman-test-2026'
                  keyAlias 'djiman_native_test'
                  keyPassword 'djiman-test-2026'
              }
          }

          """
          s = s.replace(needle, signing + needle, 1)
          anchor = "    buildFeatures {\n"
          if anchor not in s:
              raise SystemExit('buildFeatures block not found')
          build_types = """    buildTypes {
              debug {
                  applicationIdSuffix '.nativefullsync'
                  versionNameSuffix '-nativefullsync-test'
                  signingConfig signingConfigs.nativeTest
              }
          }

          """
          s = s.replace(anchor, build_types + anchor, 1)
          p.write_text(s)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = m.replace('android:label="DJ IMAN 3.4 Advance"',
                        'android:label="DJ IMAN Native Test"')
          manifest.write_text(m)
          PYCODE

      - name: Build full-native APK
        working-directory: extracted/DJ_IMAN_3_4_NATIVE_ANDROID
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify installability, signature and package
        shell: bash
        working-directory: extracted/DJ_IMAN_3_4_NATIVE_ANDROID
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          mkdir -p dist
          cp "$APK" 'dist/DJ-IMAN-3.4-Full-Native-Sync-Test.apk'
          sha256sum 'dist/DJ-IMAN-3.4-Full-Native-Sync-Test.apk' | tee 'dist/DJ-IMAN-3.4-Full-Native-Sync-Test.apk.sha256'

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: DJ-IMAN-3.4-Full-Native-Sync-Test-APK
          path: |
            extracted/DJ_IMAN_3_4_NATIVE_ANDROID/dist/DJ-IMAN-3.4-Full-Native-Sync-Test.apk
            extracted/DJ_IMAN_3_4_NATIVE_ANDROID/dist/DJ-IMAN-3.4-Full-Native-Sync-Test.apk.sha256
          if-no-files-found: error
          retention-days: 30
